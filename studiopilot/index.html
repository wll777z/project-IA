<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudioPilot AI</title><style>body{background:#0c101b;color:#e8ebfa;font:16px system-ui;display:grid;place-items:center;min-height:95vh}main{background:#191e30;padding:28px;border-radius:18px;width:min(660px,90vw)}input,textarea{display:block;width:100%;box-sizing:border-box;background:#101527;color:white;border:1px solid #454d66;border-radius:9px;padding:12px;margin:10px 0}textarea{height:125px}button{background:#9993ff;border:0;padding:12px 18px;border-radius:9px;cursor:pointer}#log{white-space:pre-wrap;color:#b8c3e0}</style></head><body><main><h1>✦ StudioPilot AI <small>0.1</small></h1><p>Chat local conectado ao Roblox Studio. Sem IA nesta versão.</p><label>Token do terminal</label><input id="token" type="password" placeholder="Cole o token"><button id="check">Verificar</button><p id="status">Aguardando conexão</p><textarea id="message" maxlength="1000" placeholder="Descreva sua ideia para o jogo..."></textarea><button id="send">Enviar ao Roblox Studio</button><h3>Atividade</h3><div id="log">Nenhuma mensagem enviada.</div><p><small>Somente localhost. Não compartilhe seu token.</small></p></main><script>
const token=document.getElementById('token'),msg=document.getElementById('message'),status=document.getElementById('status'),log=document.getElementById('log');
async function call(path,opts={}){const res=await fetch(path,{...opts,headers:{'X-StudioPilot-Token':token.value.trim(),...(opts.headers||{})}});const data=await res.json();if(!res.ok)throw Error(data.error);return data}
document.getElementById('check').onclick=async()=>{try{const d=await call('/api/status');status.textContent='Conectado ao servidor. Mensagens na fila: '+d.pending}catch(e){status.textContent=e.message}};
document.getElementById('send').onclick=async()=>{const value=msg.value.trim();if(!value)return;try{const d=await call('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value})});log.textContent='#'+d.id+': '+value+'\n'+log.textContent;msg.value='';status.textContent='Enviado para a fila do plugin.'}catch(e){status.textContent=e.message}};
</script></body></html>
