services:
  - type: web
    name: vibepage
    runtime: node
    plan: free
    region: oregon
    rootDir: vibepage
    buildCommand: npm ci --include=dev && npm run build
    startCommand: >-
      export BETTER_AUTH_URL="${BETTER_AUTH_URL:-$RENDER_EXTERNAL_URL}";
      test -n "$BETTER_AUTH_URL" &&
      npm run db:migrate &&
      npm run db:seed &&
      npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vibepage-db
          property: connectionString

databases:
  - name: vibepage-db
    plan: free
    region: oregon
    databaseName: vibepage
    user: vibepage
    ipAllowList: []
